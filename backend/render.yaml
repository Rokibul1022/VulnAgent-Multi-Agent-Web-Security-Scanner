services:
  - type: web
    name: vuln-agent-backend
    runtime: python
    plan: free
    buildCommand: apt-get update && apt-get install -y --no-install-recommends chromium && pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    rootDir: backend
    healthCheckPath: /
    envVars:
      - key: LLM_API_KEYS
        sync: false
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
        sync: false
      - key: ZAP_DOCKER_IMAGE
        value: zaproxy/zap-stable
      - key: PYTHON_VERSION
        value: 3.11.9
