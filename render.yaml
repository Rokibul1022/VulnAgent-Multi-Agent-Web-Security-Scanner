services:
  # VulnAgent backend blueprint
  - type: web
    name: vuln-agent-backend
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: Dockerfile
    healthCheckPath: /
    envVars:
      - key: LLM_API_KEYS
        sync: false
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      - key: ZAP_DOCKER_IMAGE
        value: zaproxy/zap-stable
      - key: PYTHON_VERSION
        value: 3.11.9
